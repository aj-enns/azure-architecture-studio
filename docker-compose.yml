name: azure-architecture-studio

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 8080
      CORS_ORIGIN: http://localhost:8080
      IAC_IMPORT_ENABLED: ${IAC_IMPORT_ENABLED:-true}
      LEARN_GROUNDING_ENABLED: ${LEARN_GROUNDING_ENABLED:-true}
      LEARN_MCP_ENDPOINT: ${LEARN_MCP_ENDPOINT:-https://learn.microsoft.com/api/mcp}
      AZURE_FOUNDRY_ENDPOINT: ${AZURE_FOUNDRY_ENDPOINT:-}
      AZURE_FOUNDRY_MODEL: ${AZURE_FOUNDRY_MODEL:-}
      AZURE_FOUNDRY_RESOURCE_ID: ${AZURE_FOUNDRY_RESOURCE_ID:-}
      AZURE_FOUNDRY_API_KEY: ${AZURE_FOUNDRY_API_KEY:-}
      AZURE_FOUNDRY_API_VERSION: ${AZURE_FOUNDRY_API_VERSION:-2024-05-01-preview}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy

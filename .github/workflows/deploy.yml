name: deploy

# Builds the API + web images and deploys them to Azure Container Apps.
#
# Flow (breaks the image chicken-and-egg):
#   1. provision  - deploy registry.bicep (ACR + pull identity)
#   2. build      - az acr build both images, tagged with the commit SHA
#   3. deploy     - deploy main.bicep (env + apps) on the freshly pushed images
#
# Auth is keyless via OIDC (no stored service-principal secret). Configure once:
#   Repo secrets:  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#                  ENTRA_AUTH_CLIENT_SECRET
#   Repo variables: AZURE_RESOURCE_GROUP
#                   ENTRA_AUTH_CLIENT_ID
#                   AZURE_FOUNDRY_ENDPOINT, AZURE_FOUNDRY_MODEL   (optional, enable AI)
#                   AZURE_FOUNDRY_RESOURCE_ID                     (optional, model discovery)
#
# The federated app registration needs, on the resource group:
#   - Contributor          (deploy resources + run az acr build)
#   - User Access Administrator  (create the AcrPull role assignment in registry.bicep)
#   - AcrPush              (local Docker fallback when ACR Tasks is unavailable)
# Owner covers both if you prefer a single assignment.
#
# Keyless Foundry: grant the app's user-assigned identity (aas-id-*) the
# "Cognitive Services User" (Foundry inference) and "Reader" (discovery) roles on
# your Foundry resource. See README (Deploy to Azure).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write
  contents: read

env:
  NAME: aas

jobs:
  provision:
    runs-on: ubuntu-24.04
    outputs:
      acrName: ${{ steps.registry.outputs.acrName }}
      acrLoginServer: ${{ steps.registry.outputs.acrLoginServer }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate deployment settings
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ENTRA_AUTH_CLIENT_ID: ${{ vars.ENTRA_AUTH_CLIENT_ID }}
          ENTRA_AUTH_CLIENT_SECRET: ${{ secrets.ENTRA_AUTH_CLIENT_SECRET }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP ENTRA_AUTH_CLIENT_ID ENTRA_AUTH_CLIENT_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository setting: $name. See docs/deploy-application.md#automate-with-github-actions."
              exit 1
            fi
          done
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ENTRA_AUTH_CLIENT_ID; do
            if [[ ! "${!name}" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
              echo "::error::$name must be a GUID without quotes or surrounding whitespace."
              exit 1
            fi
          done

      - name: Azure login (OIDC)
        id: azure-login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Explain Azure login failure
        if: ${{ failure() && steps.azure-login.outcome == 'failure' }}
        run: |
          echo "::error::Azure login failed. Check the deployment Application (client) ID, tenant, and federated subject. For 'No subscriptions found', have an administrator grant this deployment service principal Contributor and User Access Administrator on the existing application resource group, then allow RBAC propagation and rerun."
          echo "See docs/deploy-application.md#1-create-a-separate-deployment-identity. Do not use the web sign-in client ID or allow-no-subscriptions to bypass this failure." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify existing resource group access
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          if ! az group show --subscription "$AZURE_SUBSCRIPTION_ID" --name "$AZURE_RESOURCE_GROUP" --output none; then
            echo "::error::The application resource group must already exist and be accessible to the deployment identity. An administrator must complete the infrastructure bootstrap before this workflow runs."
            exit 1
          fi

      - name: Validate registry deployment permissions
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          if ! az deployment group validate --resource-group "$AZURE_RESOURCE_GROUP" --template-file infra/registry.bicep --parameters name="$NAME" --validation-level Provider --output none; then
            echo "::error::Registry deployment validation failed. Review the Azure error above, including resource policy and permissions to deploy resources and create AcrPull role assignments. See the administrator setup in docs/deploy-application.md."
            exit 1
          fi

      - name: Deploy registry + identity
        id: registry
        run: |
          outputs=$(az deployment group create \
            --name "$NAME-registry" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/registry.bicep \
            --parameters name="$NAME" \
            --query properties.outputs -o json)
          echo "acrName=$(echo "$outputs" | jq -r .acrName.value)" >> "$GITHUB_OUTPUT"
          echo "acrLoginServer=$(echo "$outputs" | jq -r .acrLoginServer.value)" >> "$GITHUB_OUTPUT"

  build:
    needs: provision
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push API image
        run: |
          if ! az acr build \
              --registry "${{ needs.provision.outputs.acrName }}" \
              --image "aas-api:${{ github.sha }}" \
              --file apps/api/Dockerfile .; then
            echo "::warning::ACR Quick Build failed; using the runner's Docker engine."
            az acr login --name "${{ needs.provision.outputs.acrName }}"
            docker build \
              --tag "${{ needs.provision.outputs.acrLoginServer }}/aas-api:${{ github.sha }}" \
              --file apps/api/Dockerfile .
            docker push "${{ needs.provision.outputs.acrLoginServer }}/aas-api:${{ github.sha }}"
          fi

      - name: Build & push web image
        run: |
          if ! az acr build \
              --registry "${{ needs.provision.outputs.acrName }}" \
              --image "aas-web:${{ github.sha }}" \
              --file apps/web/Dockerfile .; then
            echo "::warning::ACR Quick Build failed; using the runner's Docker engine."
            az acr login --name "${{ needs.provision.outputs.acrName }}"
            docker build \
              --tag "${{ needs.provision.outputs.acrLoginServer }}/aas-web:${{ github.sha }}" \
              --file apps/web/Dockerfile .
            docker push "${{ needs.provision.outputs.acrLoginServer }}/aas-web:${{ github.sha }}"
          fi

  deploy:
    needs: [provision, build]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Entra authentication configuration
        env:
          ENTRA_AUTH_CLIENT_ID: ${{ vars.ENTRA_AUTH_CLIENT_ID }}
          ENTRA_AUTH_CLIENT_SECRET: ${{ secrets.ENTRA_AUTH_CLIENT_SECRET }}
        run: |
          if [[ -z "$ENTRA_AUTH_CLIENT_ID" || -z "$ENTRA_AUTH_CLIENT_SECRET" ]]; then
            echo "::error::Azure deployments require ENTRA_AUTH_CLIENT_ID and ENTRA_AUTH_CLIENT_SECRET."
            exit 1
          fi

      - name: Deploy app (Container Apps)
        id: app
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          registryOutputs=$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$NAME-registry" \
            --query properties.outputs -o json)
          managedIdentityId=$(echo "$registryOutputs" | jq -er '.identityId.value | select(type == "string" and length > 0)')
          managedIdentityClientId=$(echo "$registryOutputs" | jq -er '.identityClientId.value | select(type == "string" and length > 0)')
          if [[ ! "$managedIdentityId" =~ ^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft.ManagedIdentity/userAssignedIdentities/[^/]+$ || ! "$managedIdentityClientId" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
            echo "::error::Registry deployment returned an invalid managed identity ID or client ID. Stop before deploying Container Apps."
            exit 1
          fi
          outputs=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters \
              name="$NAME" \
              acrLoginServer="${{ needs.provision.outputs.acrLoginServer }}" \
              managedIdentityId="$managedIdentityId" \
              managedIdentityClientId="$managedIdentityClientId" \
              imageTag="${{ github.sha }}" \
              azureFoundryEndpoint="${{ vars.AZURE_FOUNDRY_ENDPOINT }}" \
              azureFoundryModel="${{ vars.AZURE_FOUNDRY_MODEL }}" \
              azureFoundryResourceId="${{ vars.AZURE_FOUNDRY_RESOURCE_ID }}" \
              entraTenantId="${{ secrets.AZURE_TENANT_ID }}" \
              entraClientId="${{ vars.ENTRA_AUTH_CLIENT_ID }}" \
              entraClientSecret="${{ secrets.ENTRA_AUTH_CLIENT_SECRET }}" \
            --query properties.outputs -o json)
          echo "webFqdn=$(echo "$outputs" | jq -r .webFqdn.value)" >> "$GITHUB_OUTPUT"

          for app in "$NAME-api" "$NAME-web"; do
            expectedImage="${{ needs.provision.outputs.acrLoginServer }}/$app:${{ github.sha }}"
            for attempt in {1..36}; do
              state=$(az containerapp show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$app" \
                --output json)
              latestRevision=$(echo "$state" | jq -r .properties.latestRevisionName)
              readyRevision=$(echo "$state" | jq -r .properties.latestReadyRevisionName)
              runningStatus=$(echo "$state" | jq -r .properties.runningStatus)
              deployedImage=$(echo "$state" | jq -r .properties.template.containers[0].image)
              if [[ "$latestRevision" == "$readyRevision" && "$runningStatus" == "Running" && "$deployedImage" == "$expectedImage" ]]; then
                echo "$app is ready on $latestRevision with $deployedImage"
                break
              fi
              if [[ "$attempt" -eq 36 ]]; then
                echo "::error::$app did not activate the expected image. latest=$latestRevision ready=$readyRevision status=$runningStatus image=$deployedImage expected=$expectedImage"
                exit 1
              fi
              sleep 5
            done
          done

      - name: Summary
        run: |
          echo "### Deployed → https://${{ steps.app.outputs.webFqdn }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Entra callback URI: \`https://${{ steps.app.outputs.webFqdn }}/.auth/login/aad/callback\`" >> "$GITHUB_STEP_SUMMARY"
